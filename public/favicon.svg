<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Synthos">
  <style>
    .plate { fill: #0e0e0e; }
    .s-ink { stroke: #f0f0f0; }
    .s-dot { fill: #0066ff; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #ffffff; }
      .s-ink { stroke: #000000; }
      .s-dot { fill: #0066ff; }
    }
  </style>

  <!-- Rounded plate keeps the mark legible down to 16px. -->
  <rect class="plate" width="64" height="64" rx="14" />

  <!-- Signal accent, the same blue used across the product. -->
  <circle class="s-dot" cx="47" cy="18" r="5" />

  <!-- Serif S as a stroke so it reads cleanly at favicon sizes. -->
  <path
    class="s-ink"
    d="M42 25c-2.4-2.6-5.7-3.9-9.2-3.9-5.8 0-10.1 3-10.1 7.7 0 4.4 3.2 6.3 9.9 7.7 5.9 1.2 9 2.7 9 6.7 0 4-3.5 6.3-8.8 6.3-4 0-7.6-1.5-10-4.4"
    fill="none"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
